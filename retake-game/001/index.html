<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E5CF">
  <meta name="description" content="RETAKE GAME #001。毎回ランダムに変わる6個の物と収納場所を、猫の両手で片付けるタイムアタックゲーム。">
  <title>猫の手も借りたい RETAKE #001</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>

  <main id="game" aria-label="猫の手も借りたい RETAKE #001">
    <canvas id="canvas" width="360" height="640" tabindex="0" aria-label="猫の手も借りたい RETAKE #001 ゲーム画面" aria-describedby="instructions">Canvasに対応したブラウザで遊んでください。</canvas>
    <button id="action" type="button" aria-label="スタート">スタート</button>
    <p id="instructions" class="sr-only">画面をドラッグして猫の両手を動かします。手は指の60ピクセル上にあります。手の間で物をつかみ、ゴミはゴミ箱、洗濯物は洗濯カゴ、おもちゃはおもちゃ箱へ運びます。物の種類・位置・収納場所の並びは毎回変わります。指を離しても物は保持されます。キーボードでは矢印キーでも移動できます。</p>
    <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript>遊ぶにはブラウザのJavaScriptを有効にしてください。</noscript>

  <script data-rtg-visit-counter>
    (() => {
      if (window.top !== window.self) return;
      if (location.hostname !== 'ryg4mk.github.io') return;

      const gameId = '001';
      const key = 'retake_' + gameId + '_views_bkg_rtg_views_20261014_v1';

      fetch('https://countapi.mileshilliard.com/api/v1/hit/' + encodeURIComponent(key), {
        credentials: 'omit',
        referrerPolicy: 'no-referrer',
        cache: 'no-store',
        keepalive: true
      }).catch(() => {});
    })();
  </script>
</body>
</html>
